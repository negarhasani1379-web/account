{% extends 'base.html' %}

{% block title %}
Person Detail
{% endblock %}

{% block content %}

<h2>Person Detail</h2>

<p>
    First Name:
    {{ object.first_name }}
</p>

<p>
    Last Name:
    {{ object.last_name }}
</p>

<p>
    National Code:
    {{ object.national_code }}
</p>

<p>
    Phone:
    {{ object.phone_number }}
</p>

{% endblock %}
